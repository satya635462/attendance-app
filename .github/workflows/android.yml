name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare app files
        run: |
          sed -i "s#YOUR_GITHUB_USERNAME/attendance-app#${{ github.repository }}#" www/index.html
          python3 -c "import json;d=json.load(open('google-services.json'));open('www/fb-config.js','w').write('window.FB='+json.dumps({'projectId':d['project_info']['project_id']})+';')"
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.plugins=Object.assign({},c.plugins,{FirebaseAuthentication:{skipNativeAuth:false,providers:['google.com']}});fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - run: sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.2.0'/" android/app/build.gradle
      - run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias attendance --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out attendance.apk aligned.apk
          $BT/apksigner verify attendance.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" attendance.apk --title "Build ${{ github.run_number }}" --notes "Signed build"
