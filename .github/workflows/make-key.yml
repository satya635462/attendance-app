name: Make signing key
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore release.jks -alias attendance -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Attendance, O=Attendance, C=IN"
          {
            echo "KEYSTORE_BASE64 (one long line):"
            base64 -w0 release.jks
            echo
            echo
            echo "KEY_PASSWORD: $PASS"
          } > signing-info.txt
          keytool -list -v -keystore release.jks -storepass "$PASS" | grep -E "SHA1|SHA256" > fingerprints.txt
          cat fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-info
          path: |
            signing-info.txt
            fingerprints.txt
            release.jks
